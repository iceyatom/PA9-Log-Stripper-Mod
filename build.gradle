plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	// Final jar name convention: "logstripper - <minecraft version> - <mod version>.jar"
	archivesName = "logstripper - ${project.minecraft_version}"
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"logstripper" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.x jars are obfuscated, so Loom remaps them. Official Mojang mappings keep the source
	// on the same Mojmap names as the 26.x branches; the jar is remapped to intermediary on build.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Minecraft 1.21.x targets Java 21. The build runs on the installed JDK 25; `release = 21` makes
// javac emit Java 21 bytecode and reject any API newer than Java 21.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// The pre-remap jar is a dev-only intermediate; the remapped jar is the release.
jar {
	from("LICENSE")
	archiveClassifier = "dev"
}

remapJar {
	// Naming convention: "logstripper - <minecraft version> - <mod version>.jar"
	archiveFileName = "logstripper - ${project.minecraft_version} - ${project.mod_version}.jar"
}
